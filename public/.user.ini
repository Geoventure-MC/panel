; Limites d'upload — permet l'envoi de plusieurs mods (.jar) lourds en une fois
; via le file-manager (config/file-manager.php : maxUploadFileSize = null).
; Utilisé par PHP en mode FPM/CGI. Pour Apache mod_php, voir public/.htaccess.
upload_max_filesize = 256M
post_max_size = 512M
max_file_uploads = 200
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
