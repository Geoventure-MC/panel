name: Panel Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION}"

      - name: Sync version to config/app.php
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i -E "s/('version'[[:space:]]*=>[[:space:]]*)'[^']*'/\1'${VERSION}'/" config/app.php

      - name: Generate release notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE=""
          fi

          COMMITS=$(git log $RANGE --no-merges --pretty=format:"%s" | grep -v "\[skip ci\]" || true)

          FEATS=$(echo "$COMMITS"  | grep -iE "^feat(\(|:|/| )|^feature" | sed -E "s/^[a-zA-Z]+(\([^)]*\))?:? ?//" | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS"  | grep -iE "^fix(\(|:|/| )"          | sed -E "s/^[a-zA-Z]+(\([^)]*\))?:? ?//" | sed 's/^/- /' || true)
          OTHERS=$(echo "$COMMITS" | grep -viE "^feat(\(|:|/| )|^feature|^fix(\(|:|/| )" | sed -E "s/^[a-zA-Z]+(\([^)]*\))?:? ?//" | sed 's/^/- /' || true)

          {
            echo "## Geoventure Panel v${VERSION}"
            echo ""
            echo "Panel d'administration Geoventure-MC, autonome (PHP + assets inclus)."
            echo ""
            if [ -n "$FEATS" ]; then
              echo "### Nouveautes"
              echo "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Corrections"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### Autres changements"
              echo "$OTHERS"
              echo ""
            fi
            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "Cette archive est telechargee automatiquement par l'installer Geoventure."
            echo ""
            echo "> Asset : \`panel-${VERSION}.zip\`"
            echo ""
            echo "- Apres extraction, ouvrir le domaine pour lancer l'assistant d'installation."
            echo "- Mise a jour : lancer \`php artisan migrate\`."
          } > RELEASE_NOTES.md

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, json, mbstring, openssl, pdo, tokenizer, xml, xmlwriter, curl, fileinfo, zip
          tools: composer

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run production

      - name: Build self-contained panel package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          zip -r "panel-${VERSION}.zip" . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".gitignore" \
               ".gitattributes" \
               ".editorconfig" \
               "phpunit.xml" \
               "RELEASE_NOTES.md" \
               "*.zip"
          echo "Created panel-${VERSION}.zip"
          ls -lh "panel-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Geoventure Panel v${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: panel-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
