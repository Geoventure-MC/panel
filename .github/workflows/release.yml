name: Panel Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decide release
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch"   >> "$GITHUB_OUTPUT"
            echo "Manual dispatch -> release (patch)"; exit 0
          fi
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; else RANGE=""; fi
          LOG=$(git log $RANGE --no-merges --pretty=format:'%s' | grep -v '\[skip ci\]' || true)
          if [ -z "$(printf '%s' "$LOG" | tr -d '[:space:]')" ]; then
            echo "No new commits -> skip"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NONTRIVIAL=0; BUMP="patch"
          while IFS= read -r MSG; do
            [ -z "$MSG" ] && continue
            case "$MSG" in
              docs:*|chore:*|style:*|ci:*|test:*|refactor:*|build:*) continue ;;
              "📝"*|"📚"*|"🔄"*|"✅"*|"🔖"*|"💚"*|"👷"*|"📄"*) continue ;;
            esac
            NONTRIVIAL=1
            if printf '%s' "$MSG" | grep -qiE 'breaking change|!:'; then BUMP="major";
            elif printf '%s' "$MSG" | grep -qiE '^feat(\(.+\))?:|^feature|✨|🎉|🚀'; then
              [ "$BUMP" != "major" ] && BUMP="minor"; fi
          done <<EOF
          $LOG
          EOF
          if [ "$NONTRIVIAL" = "0" ]; then
            echo "Only trivial commits -> skip release"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            echo "Release -> bump=$BUMP"
          fi

      - name: Compute version
        id: version
        if: steps.decide.outputs.release == 'true'
        run: |
          BUMP="${{ steps.decide.outputs.bump }}"
          npm version "$BUMP" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/('version'[[:space:]]*=>[[:space:]]*)'[^']*'/\1'${NEW_VERSION}'/" config/app.php
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: v${NEW_VERSION}"

      - name: Generate release notes
        if: steps.decide.outputs.release == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE=""
          fi

          COMMITS=$(git log $RANGE --no-merges --pretty=format:"%s" | grep -v "\[skip ci\]" || true)

          # Classement des commits en sections lisibles (messages en français).
          COMMITS=$(echo "$COMMITS" | awk '!seen[$0]++' | grep -v '\[skip ci\]' | grep -vE '^(chore|Merge )' || true)
          TECH=$(echo "$COMMITS"  | grep -E  '^(Correction build|Correction des? workflow|CI( |:)|Workflow|Refactor|Suppression|Nettoyage|Documentation|README|CLAUDE)' || true)
          REST=$(echo "$COMMITS"  | grep -vE '^(Correction build|Correction des? workflow|CI( |:)|Workflow|Refactor|Suppression|Nettoyage|Documentation|README|CLAUDE)' || true)
          FIXES=$(echo "$REST"    | grep -E  '^(Correction|Corrige|Fix|Hotfix|Bugfix|Répar)' || true)
          PERFS=$(echo "$REST"    | grep -E  '^(Optimisation|Amélioration|Perf|Robustesse|Stabilité)' || true)
          FEATS=$(echo "$REST"    | grep -vE '^(Correction|Corrige|Fix|Hotfix|Bugfix|Répar|Optimisation|Amélioration|Perf|Robustesse|Stabilité)' || true)
          section() { if [ -n "$2" ]; then echo "### $1"; echo ""; echo "$2" | sed 's/^/- /'; echo ""; fi; }

          {
            echo "# 🖥 Geoventure Panel v${VERSION}"
            echo ""
            echo "> Le panel d'administration de **Geoventure-MC** — autonome (PHP + assets inclus)."
            echo ""
            echo "📅 $(date '+%d/%m/%Y')"
            echo ""
            echo "---"
            echo ""
            section "✨ Nouveautés" "$FEATS"
            section "⚡ Améliorations" "$PERFS"
            section "🐛 Corrections" "$FIXES"
            section "🔧 Technique" "$TECH"
            if [ -z "$FEATS$PERFS$FIXES$TECH" ]; then
              echo "_Mise à jour de maintenance._"
              echo ""
            fi
            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "Cette archive est telechargee automatiquement par l'installer Geoventure."
            echo ""
            echo "> Asset : \`panel-${VERSION}.zip\`"
            echo ""
            echo "- Apres extraction, ouvrir le domaine pour lancer l'assistant d'installation."
            echo "- Mise a jour : lancer \`php artisan migrate\`."
          } > RELEASE_NOTES.md

      - name: Setup PHP 8.2
        if: steps.decide.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, json, mbstring, openssl, pdo, tokenizer, xml, xmlwriter, curl, fileinfo, zip
          tools: composer

      - name: Install PHP dependencies (production)
        if: steps.decide.outputs.release == 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Setup Node.js 18
        if: steps.decide.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & build frontend assets
        if: steps.decide.outputs.release == 'true'
        run: |
          npm ci
          npm run production

      - name: Build self-contained panel package
        if: steps.decide.outputs.release == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          zip -r "panel-${VERSION}.zip" . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".gitignore" \
               ".gitattributes" \
               ".editorconfig" \
               "phpunit.xml" \
               "RELEASE_NOTES.md" \
               "*.zip"
          echo "Created panel-${VERSION}.zip"
          ls -lh "panel-${VERSION}.zip"

      - name: Commit version bump
        if: steps.decide.outputs.release == 'true'
        run: |
          git add package.json config/app.php
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Create GitHub Release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Geoventure Panel v${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: panel-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
