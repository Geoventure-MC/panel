name: Panel Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push origin main
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped to v${NEW_VERSION}"

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, json, mbstring, openssl, pdo, tokenizer, xml, xmlwriter, curl, fileinfo, zip
          tools: composer

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run production

      - name: Build self-contained panel package
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          zip -r "panel-${VERSION}.zip" . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".gitignore" \
               ".gitattributes" \
               ".editorconfig" \
               "phpunit.xml" \
               "*.zip"
          echo "Created panel-${VERSION}.zip"
          ls -lh "panel-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: "\U0001F5A5️ Geoventure Panel v${{ steps.bump.outputs.version }}"
          body: |
            ## \U0001F5A5️ Geoventure Panel v${{ steps.bump.outputs.version }}

            Panel d'administration Geoventure-MC, prêt à l'emploi et **autonome**
            (dépendances PHP + assets déjà inclus).

            ---

            ### \U0001F4E6 Installation

            Cette archive est téléchargée **automatiquement par l'installer Geoventure**.
            Tu n'as normalement rien à faire ici manuellement : utilise l'installer.

            > Asset à télécharger : `panel-${{ steps.bump.outputs.version }}.zip`

            ---

            ### \U0001F4DD Notes

            - Après extraction sur le serveur web, ouvre ton domaine pour lancer l'assistant d'installation.
            - Pense à lancer `php artisan migrate` si tu mets à jour un panel existant.
          files: panel-${{ steps.bump.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
