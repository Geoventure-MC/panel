name: Panel Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Détermine le type de bump (major/minor/patch) à partir des messages
      # de commit depuis le dernier tag, façon "semantic versioning logique".
      #   - feat / feature                         -> minor
      #   - BREAKING CHANGE ou "!:" (ex: feat!:)   -> major
      #   - tout le reste (fix, chore, docs...)    -> patch
      - name: Determine version bump & changelog
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            echo "Aucun tag précédent, analyse de tout l'historique."
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "Analyse des commits depuis ${LAST_TAG}."
          fi

          # Liste des commits (hors merges, hors bumps automatiques)
          COMMITS=$(git log $RANGE --no-merges --pretty=format:"%s" | grep -v -i "bump version" | grep -v "\[skip ci\]" || true)

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "breaking change|!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(|:|/| )|^feature"; then
            BUMP="minor"
          fi
          echo "Type de bump détecté : $BUMP"

          # Applique le bump (package.json) sans créer de tag git
          npm version "$BUMP" --no-git-tag-version >/dev/null
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Nouvelle version : v${NEW_VERSION}"

          # Synchronise la version exposée par le panel (config/app.php)
          # -> c'est celle que la page "Mise à jour" compare aux releases.
          sed -i -E "s/('version'[[:space:]]*=>[[:space:]]*)'[^']*'/\1'${NEW_VERSION}'/" config/app.php

          # Génère des notes de release "friendly" et catégorisées
          FEATS=$(echo "$COMMITS"  | grep -iE "^feat(\(|:|/| )|^feature" | sed -E "s/^[a-zA-Z]+(\([^)]*\))?:? ?//" | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS"  | grep -iE "^fix(\(|:|/| )"          | sed -E "s/^[a-zA-Z]+(\([^)]*\))?:? ?//" | sed 's/^/- /' || true)
          OTHERS=$(echo "$COMMITS" | grep -viE "^feat(\(|:|/| )|^feature|^fix(\(|:|/| )" | sed -E "s/^[a-zA-Z]+(\([^)]*\))?:? ?//" | sed 's/^/- /' || true)

          {
            echo "## 🖥️ Geoventure Panel v${NEW_VERSION}"
            echo ""
            echo "Panel d'administration Geoventure-MC, prêt à l'emploi et **autonome**"
            echo "(dépendances PHP + assets déjà inclus)."
            echo ""
            if [ -n "$FEATS" ]; then
              echo "### ✨ Nouveautés"
              echo "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Corrections"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 Autres changements"
              echo "$OTHERS"
              echo ""
            fi
            echo "---"
            echo ""
            echo "### 📦 Installation"
            echo ""
            echo "Cette archive est téléchargée **automatiquement par l'installer Geoventure**."
            echo "Tu n'as normalement rien à faire ici manuellement : utilise l'installer."
            echo ""
            echo "> Asset à télécharger : \`panel-${NEW_VERSION}.zip\`"
            echo ""
            echo "### 📝 Notes"
            echo ""
            echo "- Après extraction sur le serveur web, ouvre ton domaine pour lancer l'assistant d'installation."
            echo "- Si tu mets à jour un panel existant, pense à lancer \`php artisan migrate\`."
          } > RELEASE_NOTES.md

          # Commit du bump (package.json + config/app.php)
          git add package.json config/app.php
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push origin main

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, json, mbstring, openssl, pdo, tokenizer, xml, xmlwriter, curl, fileinfo, zip
          tools: composer

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run production

      - name: Build self-contained panel package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          zip -r "panel-${VERSION}.zip" . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".gitignore" \
               ".gitattributes" \
               ".editorconfig" \
               "phpunit.xml" \
               "RELEASE_NOTES.md" \
               "*.zip"
          echo "Created panel-${VERSION}.zip"
          ls -lh "panel-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "\U0001F5A5️ Geoventure Panel v${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: panel-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
